# Weekly update PRs for pinned GitHub Actions, container images and the Terraform AWS
# provider. Python tooling is upgraded deliberately with `make lock`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      grafana-stack:
        patterns: ["grafana/*"]
      prometheus-stack:
        patterns: ["prom/*"]
    ignore:
      # alert-sink runs on the same Python image as the tools (locked for 3.12), so
      # minor versions move together, deliberately. Patch releases still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build

  # Provider version and lock file of the example environment.
  - package-ecosystem: terraform
    directory: /terraform/environments/example
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: weekly
    ignore:
      # tools/requirements.txt is resolved for Python 3.12: newer minor versions are a
      # deliberate change together with `make lock`. Patch releases still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
