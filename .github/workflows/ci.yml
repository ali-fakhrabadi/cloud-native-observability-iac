name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint YAML, shell, Ansible, dashboards and runbooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned tooling
        run: pip install --require-hashes -r tools/requirements.txt

      - name: yamllint
        run: yamllint --strict .

      - name: shellcheck
        run: shellcheck scripts/*.sh terraform/modules/*/files/*.sh

      - name: Dashboards match their generator
        run: python3 tools/dashboards/build.py --check

      - name: Every alert has a runbook
        run: python3 scripts/check_runbooks.py

      - name: ansible-lint (production profile)
        run: ansible-lint
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles

  validate:
    name: Validate configuration with the pinned binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose, promtool, amtool, Loki and Alloy checks
        run: make validate

      - name: Alert rule unit tests and Alertmanager routing tests
        run: make test-rules

  terraform:
    name: "Terraform: fmt, validate, tflint, Trivy and tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: terraform fmt and validate, tflint
        run: make terraform-lint
        env:
          # tflint downloads its AWS ruleset from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Trivy misconfiguration scan
        run: make terraform-scan

      # Mocked AWS provider: no account, credentials or cost.
      - name: terraform test
        run: make test-terraform

  molecule:
    name: "Molecule: ${{ matrix.role }}"
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        role: [linux_hardening, observability_stack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned tooling
        run: pip install --require-hashes -r tools/requirements.txt

      # Disposable systemd containers: converge, converge again (must change nothing),
      # verify, destroy.
      - name: Molecule test
        run: molecule test
        working-directory: ansible/roles/${{ matrix.role }}
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"

  smoke:
    name: Start the stack and test it end to end
    needs: [lint, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate configuration and secrets
        run: make env secrets

      - name: Start the stack
        run: make up

      - name: Smoke test
        run: make smoke

      - name: Every dashboard query runs against the live stack
        run: make check-dashboards

      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.observability.yml ps --all
          docker compose -f docker-compose.observability.yml logs --tail 80

      - name: Tear down
        if: always()
        run: make destroy
