extends: default

rules:
  line-length:
    max: 150
    level: warning
    # URLs (runbook links) cannot be wrapped.
    allow-non-breakable-inline-mappings: true
    # promtool test series are one label set per line and cannot be wrapped.
    ignore: |
      config/prometheus/tests/
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

ignore: |
  .terraform/
  **/.terraform/
  .cache/
