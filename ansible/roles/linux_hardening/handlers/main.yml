---
- name: Reload SSH
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply kernel parameters
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: linux_hardening_sysctl_apply | bool
