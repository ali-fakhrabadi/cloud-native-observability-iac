---
# Disposable Debian 12 and Ubuntu 24.04 machines with systemd. They run privileged so
# UFW, sshd and fail2ban behave as on a server; firewall rules stay inside the
# container's network namespace, and kernel parameters are written but never applied
# (they are not namespaced; see linux_hardening_sysctl_apply).
dependency:
  name: galaxy
  enabled: false # collections come from the hash-pinned `ansible` package
driver:
  name: docker
platforms:
  - name: hardening-debian12
    image: debian:12
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    command: /lib/systemd/systemd
  - name: hardening-ubuntu2404
    image: ubuntu:24.04
    dockerfile: ../../../../molecule/Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: ["/run", "/tmp"]
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../../
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
