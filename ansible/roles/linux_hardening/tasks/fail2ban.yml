---
- name: Configure the fail2ban jails
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.d/00-hardening.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Keep fail2ban enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
