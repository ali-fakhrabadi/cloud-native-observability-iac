---
# SSH is allowed (and rate limited) before the firewall is enabled, so applying the role
# over SSH never cuts the connection it runs on.
- name: Allow SSH, rate limited
  community.general.ufw:
    rule: limit
    port: "{{ linux_hardening_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: SSH
  loop: "{{ linux_hardening_firewall_ssh_sources }}"

- name: Allow the listed ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    from_ip: "{{ item.from | default('any') }}"
    comment: "{{ item.comment | default(omit, true) }}"
  loop: "{{ linux_hardening_firewall_allowed_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }} from {{ item.from | default('any') }}"

- name: Deny incoming and allow outgoing traffic by default
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Log blocked connections
  community.general.ufw:
    logging: "{{ linux_hardening_firewall_logging }}"

- name: Enable the firewall
  community.general.ufw:
    state: enabled
