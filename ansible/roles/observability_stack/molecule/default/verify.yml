---
- name: Verify the deployed stack
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the end-to-end smoke test again
      ansible.builtin.command:
        cmd: python3 scripts/smoke_test.py --timeout 120
        chdir: /opt/observability
      changed_when: false

    - name: Run every dashboard query against the deployed stack
      ansible.builtin.command:
        cmd: python3 scripts/check_dashboards.py
        chdir: /opt/observability
      changed_when: false

    - name: Read the secrets directory
      ansible.builtin.stat:
        path: /opt/observability/secrets
      register: observability_stack_secrets_dir

    - name: Read the settings file
      ansible.builtin.stat:
        path: /opt/observability/.env
      register: observability_stack_env_file

    - name: Secrets and settings are not readable by other users
      ansible.builtin.assert:
        that:
          - observability_stack_secrets_dir.stat.mode == '0700'
          - observability_stack_env_file.stat.mode == '0640'

    - name: Read the Docker daemon configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: observability_stack_daemon

    - name: Docker keeps containers running across daemon restarts and rotates logs
      ansible.builtin.assert:
        that:
          - (observability_stack_daemon.content | b64decode | from_json)['live-restore']
          - (observability_stack_daemon.content | b64decode | from_json)['log-opts']['max-size'] == '10m'
