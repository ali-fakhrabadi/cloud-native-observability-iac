# Host alerts from Node Exporter. Severity: critical = act now, warning = act today.
groups:
  - name: host
    rules:
      - alert: HostHighCpuUsage
        expr: instance:node_cpu_utilisation:ratio_rate5m > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 90% on {{ $labels.instance }}"
          description: "CPU utilisation has been {{ $value | humanizePercentage }} for at least 10 minutes."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hosthighcpuusage"

      - alert: HostHighMemoryUsage
        expr: instance:node_memory_utilisation:ratio > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90% on {{ $labels.instance }}"
          description: "{{ $value | humanizePercentage }} of memory has been in use for at least 10 minutes."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hosthighmemoryusage"

      - alert: HostOomKillDetected
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The kernel killed a process for lack of memory on {{ $labels.instance }}"
          description: "At least one process was killed by the kernel OOM killer in the last 5 minutes."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hostoomkilldetected"

      - alert: HostDiskSpaceLow
        expr: instance:node_filesystem_avail:ratio < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% free on {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "{{ $value | humanizePercentage }} of {{ $labels.mountpoint }} is free."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hostdiskspacelow"

      - alert: HostDiskSpaceCritical
        expr: instance:node_filesystem_avail:ratio < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% free on {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "{{ $value | humanizePercentage }} of {{ $labels.mountpoint }} is free; writes will start failing."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hostdiskspacecritical"

      # Trend-based: catches a filling disk long before a fixed threshold does. Only for
      # filesystems already below 40% free, so growth on a nearly empty disk stays quiet.
      - alert: HostDiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
            and instance:node_filesystem_avail:ratio < 0.40
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} will be full within 24 hours"
          description: "At the growth rate of the last 6 hours the filesystem runs out of space within a day."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hostdiskwillfillin24hours"

      - alert: HostOutOfInodes
        expr: |
          node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}
            / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% free inodes on {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "{{ $value | humanizePercentage }} of inodes are free; new files cannot be created once they run out."
          runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#hostoutofinodes"
