rule_files:
  - ../rules/alerts-containers.yml

evaluation_interval: 1m

tests:
  - name: A crash loop fires; a single restart and a recreated container do not
    interval: 1m
    input_series:
      # Docker restarted web 5 times in 5 minutes.
      - series: 'docker_container_restarts_total{name="web", compose_project="app", compose_service="web"}'
        values: "0 1 2 3 4 5 5 5"
      - series: 'docker_container_restarts_total{name="worker", compose_project="app", compose_service="worker"}'
        values: "0 0 1 1 1 1 1 1"
      # Recreated under the same name: the count starts again at 0 (a reset, not restarts).
      - series: 'docker_container_restarts_total{name="api", compose_project="app", compose_service="api"}'
        values: "40 40 40 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 7m
        alertname: ContainerRestarting
        exp_alerts:
          - exp_labels: {severity: warning, name: web, compose_project: app, compose_service: web}
            exp_annotations:
              summary: "Container web is restarting repeatedly"
              description: "Docker restarted web about 5 times in 15 minutes (crash loop)."
              runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#containerrestarting"

  - name: An unhealthy container fires after 2 minutes; healthy and starting ones do not
    interval: 1m
    input_series:
      - series: 'docker_container_health_status{name="db", compose_project="app", compose_service="db", status="unhealthy"}'
        values: "1x5"
      - series: 'docker_container_health_status{name="cache", compose_project="app", compose_service="cache", status="starting"}'
        values: "1x5"
      - series: 'docker_container_health_status{name="web", compose_project="app", compose_service="web", status="healthy"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: ContainerUnhealthy
        exp_alerts: []
      - eval_time: 3m
        alertname: ContainerUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, name: db, compose_project: app, compose_service: db, status: unhealthy}
            exp_annotations:
              summary: "Container db fails its health check"
              description: "Docker has reported db as unhealthy for 2 minutes."
              runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#containerunhealthy"

  - name: A stopped service fires; recreated, one-off and short-lived containers do not
    interval: 1m
    input_series:
      # container_last_seen and container_start_time_seconds are Unix times; the test
      # clock starts at 0.
      # A Compose service that ran for 6 minutes and then stopped.
      - series: 'container_last_seen{name="db", id="/docker/a", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="db"}'
        values: "0+60x6 stale"
      - series: 'container_start_time_seconds{name="db", id="/docker/a", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="db"}'
        values: "0x6 stale"
      # Recreated under the same name: the old ID disappears, a new one continues.
      - series: 'container_last_seen{name="api", id="/docker/old", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="api"}'
        values: "0+60x6 stale"
      - series: 'container_start_time_seconds{name="api", id="/docker/old", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="api"}'
        values: "0x6 stale"
      - series: 'container_last_seen{name="api", id="/docker/new", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="api"}'
        values: "_x6 420+60x6"
      - series: 'container_start_time_seconds{name="api", id="/docker/new", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="api"}'
        values: "_x6 400x6"
      # A one-off `docker run` container without Compose labels.
      - series: 'container_last_seen{name="eager_turing", id="/docker/b"}'
        values: "0+60x6 stale"
      - series: 'container_start_time_seconds{name="eager_turing", id="/docker/b"}'
        values: "0x6 stale"
      # A Compose container that lived for 2 minutes (a one-off `compose run`).
      - series: 'container_last_seen{name="app-migrate-run", id="/docker/c", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="migrate"}'
        values: "240+60x2 stale"
      - series: 'container_start_time_seconds{name="app-migrate-run", id="/docker/c", container_label_com_docker_compose_project="app", container_label_com_docker_compose_service="migrate"}'
        values: "240x2 stale"
    alert_rule_test:
      - eval_time: 6m
        alertname: ContainerStopped
        exp_alerts: []
      - eval_time: 8m
        alertname: ContainerStopped
        exp_alerts:
          - exp_labels:
              severity: warning
              name: db
              container_label_com_docker_compose_project: app
              container_label_com_docker_compose_service: db
            exp_annotations:
              summary: "Container db stopped"
              description: "db has not been seen for 2m 0s."
              runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#containerstopped"

  - name: Memory near the limit fires; containers without a limit are ignored
    interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{name="cache"}'
        values: "95x10"
      - series: 'container_spec_memory_limit_bytes{name="cache"}'
        values: "100x10"
      - series: 'container_memory_working_set_bytes{name="unlimited"}'
        values: "1000x10"
      - series: 'container_spec_memory_limit_bytes{name="unlimited"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ContainerMemoryNearLimit
        exp_alerts:
          - exp_labels: {severity: warning, name: cache}
            exp_annotations:
              summary: "Container cache uses over 90% of its memory limit"
              description: "cache is at 95% of its limit; it will be OOM-killed when it reaches it."
              runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#containermemorynearlimit"

  - name: CPU-bound throttling fires, throttled bursts at low usage do not
    interval: 1m
    input_series:
      # Limit 0.5 cores, using 0.45 and throttled in 60% of periods: CPU-bound.
      - series: 'container_cpu_cfs_periods_total{name="worker", id="/docker/w"}'
        values: "0+600x30"
      - series: 'container_cpu_cfs_throttled_periods_total{name="worker", id="/docker/w"}'
        values: "0+360x30"
      - series: 'container_cpu_usage_seconds_total{name="worker", id="/docker/w", cpu="total"}'
        values: "0+27x30"
      - series: 'container_spec_cpu_quota{name="worker", id="/docker/w"}'
        values: "50000x30"
      # Limit 0.25 cores, using 0.02 but throttled in 60% of the periods it ran in.
      - series: 'container_cpu_cfs_periods_total{name="exporter", id="/docker/e"}'
        values: "0+600x30"
      - series: 'container_cpu_cfs_throttled_periods_total{name="exporter", id="/docker/e"}'
        values: "0+360x30"
      - series: 'container_cpu_usage_seconds_total{name="exporter", id="/docker/e", cpu="total"}'
        values: "0+1.2x30"
      - series: 'container_spec_cpu_quota{name="exporter", id="/docker/e"}'
        values: "25000x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerCpuThrottled
        exp_alerts: []
      - eval_time: 21m
        alertname: ContainerCpuThrottled
        exp_alerts:
          - exp_labels: {severity: warning, name: worker, id: /docker/w}
            exp_annotations:
              summary: "Container worker is CPU-throttled"
              description: "60% of scheduling periods hit the CPU limit for 15 minutes."
              runbook_url: "https://github.com/ali-fakhrabadi/cloud-native-observability-iac/blob/main/docs/runbooks.md#containercputhrottled"
